<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Living Madaba</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- A-Frame Extras
         مطلوب لتشغيل animation-mixer -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        /* =========================
           WELCOME SCREEN
        ========================== */

        #welcome {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 25px;

            color: white;
            z-index: 20;

            overflow: hidden;

            background-image:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.30),
                    rgba(0, 0, 0, 0.55)
                ),
                url("church.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #welcome::before {
            content: "";

            position: absolute;
            inset: 0;

            background: linear-gradient(
                135deg,
                rgba(0, 0, 0, 0.20),
                rgba(0, 0, 0, 0.45)
            );

            z-index: -1;
        }

        #content {
            position: relative;
            z-index: 5;

            max-width: 650px;
            width: 100%;

            padding: 30px;

            background: rgba(0, 0, 0, 0.22);

            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);

            border-radius: 25px;
        }

        #title {
            font-size: clamp(32px, 7vw, 52px);
            font-weight: bold;

            margin: 0 0 15px;

            line-height: 1.25;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.8);
        }

        #description {
            font-size: clamp(16px, 4vw, 20px);

            line-height: 1.7;

            margin: 0 0 30px;

            text-shadow:
                0 2px 10px rgba(0, 0, 0, 0.9);
        }

        #startButton {

            border: 2px solid white;

            background: rgba(255, 255, 255, 0.92);

            color: #111;

            padding: 15px 38px;

            font-size: 18px;

            font-weight: bold;

            border-radius: 50px;

            cursor: pointer;

            transition:
                transform 0.25s,
                background 0.25s;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.35);
        }

        #startButton:hover {

            transform: scale(1.06);

            background: white;
        }

        #startButton:active {

            transform: scale(0.97);
        }


        /* CAMERA PERMISSION CONFIRMATION */
        #cameraPermissionModal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 22px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        #cameraPermissionCard {
            width: min(100%, 420px);
            padding: 26px 22px;
            border-radius: 22px;
            text-align: center;
            color: #fff;
            background: rgba(28, 28, 28, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.45);
        }

        #cameraPermissionTitle {
            margin: 0 0 12px;
            font-size: 23px;
            line-height: 1.4;
        }

        #cameraPermissionText {
            margin: 0 0 22px;
            font-size: 16px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.9);
        }

        .cameraPermissionActions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .cameraPermissionActions button {
            flex: 1;
            min-height: 48px;
            border: 0;
            border-radius: 13px;
            padding: 12px 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #cameraPermissionYes {
            background: #fff;
            color: #171717;
        }

        #cameraPermissionNo {
            background: #454545;
            color: #fff;
        }

        /* =========================
           LANGUAGE
        ========================== */

        #languageButton {

            position: fixed;

            top: 20px;
            right: 20px;

            z-index: 30;

            background: rgba(0, 0, 0, 0.60);

            color: white;

            border: 1px solid rgba(255, 255, 255, 0.45);

            padding: 10px 16px;

            border-radius: 30px;

            cursor: pointer;

            font-size: 15px;

            backdrop-filter: blur(8px);

            transition: background 0.2s;
        }

        [dir="rtl"] #languageButton {

            right: auto;
            left: 20px;
        }

        #languageButton:hover {

            background: rgba(0, 0, 0, 0.8);
        }

        #languageMenu {

            position: fixed;

            top: 70px;
            right: 20px;

            z-index: 40;

            background: rgba(20, 20, 20, 0.95);

            border-radius: 15px;

            padding: 8px;

            display: none;

            min-width: 170px;

            max-height: 70vh;

            overflow-y: auto;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.6);

            backdrop-filter: blur(10px);
        }

        [dir="rtl"] #languageMenu {

            right: auto;
            left: 20px;
        }

        .languageOption {

            width: 100%;

            border: none;

            background: transparent;

            color: white;

            padding: 12px;

            text-align: left;

            cursor: pointer;

            border-radius: 10px;

            font-size: 15px;

            transition: background 0.2s;
        }

        [dir="rtl"] .languageOption {

            text-align: right;
        }

        .languageOption:hover {

            background: rgba(255, 255, 255, 0.15);
        }

        /* =========================
           AR INFORMATION
        ========================== */

        #ui-container {

            position: fixed;

            bottom: 30px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            text-align: center;

            background: rgba(0, 0, 0, 0.65);

            padding: 15px 25px;

            border-radius: 12px;

            color: #fff;

            backdrop-filter: blur(5px);

            display: none;

            max-width: 90%;
        }

        #ui-container h1 {

            font-size: 18px;

            margin: 0 0 10px 0;
        }

        #ui-container p {

            font-size: 14px;

            margin: 0;

            color: #ddd;
        }

        /* =========================
           MESSAGE
        ========================== */

        #message {

            position: fixed;

            top: 20px;

            left: 50%;

            transform: translateX(-50%);

            background: rgba(0, 0, 0, 0.80);

            color: white;

            padding: 14px 20px;

            border-radius: 12px;

            text-align: center;

            z-index: 50;

            display: none;

            max-width: 90%;

            line-height: 1.5;
        }

        /* =========================
           BACK BUTTON
        ========================== */

        #backButton {

            position: fixed;

            bottom: 25px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 30;

            border: none;

            background: rgba(0, 0, 0, 0.70);

            color: white;

            padding: 12px 25px;

            border-radius: 30px;

            cursor: pointer;

            display: none;

            backdrop-filter: blur(8px);
        }

        /* =========================
           AR SCENE
        ========================== */

        a-scene {

            position: fixed !important;

            inset: 0 !important;

            width: 100% !important;

            height: 100% !important;

            z-index: 1;

            visibility: hidden;
        }

    </style>
</head>

<body>

    <!-- =========================
         AR INFORMATION
    ========================== -->

    <div id="ui-container">

        <h1 id="uiTitle">خريطة مادبا الحية</h1>

        <p id="uiDesc">
            وجه الكاميرا نحو خريطة مادبا الفسيفسائية لتفعيل التجربة
        </p>

    </div>


    <!-- =========================
         AR SCENE
    ========================== -->

    <a-scene

        id="arScene"

        mindar-image="
            imageTargetSrc: targets.mind;
            maxTrack: 3;
        "

        color-space="sRGB"

        renderer="
            colorManagement: true;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        embedded
    >

        <a-assets>

            <!-- الشخصية -->
            <a-asset-item
                id="characterModel"
                src="character.glb">
            </a-asset-item>


            <!-- الأصوات -->

            <audio
                id="bellsSound"
                src="sounds/bells.wav"
                preload="auto">
            </audio>

            <audio
                id="windSound"
                src="sounds/wind.wav"
                preload="auto">
            </audio>

        </a-assets>


        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- =========================
             TARGET 0
             البوابة الرئيسية
        ========================== -->

        <a-entity
            id="target0"
            mindar-image-target="targetIndex: 0">

            <a-gltf-model

                id="character0"

                src="#characterModel"

                position="0 0 0"

                rotation="0 180 0"

                scale="0.8 0.8 0.8"

                animation-mixer="
                    clip: idle;
                    timeScale: 1;
                    crossFadeDuration: 0.3;
                "
            >
            </a-gltf-model>

        </a-entity>


        <!-- =========================
             TARGET 1
             الواجهة الجانبية
        ========================== -->

        <a-entity
            id="target1"
            mindar-image-target="targetIndex: 1">

            <a-gltf-model

                id="character1"

                src="#characterModel"

                position="0 0 0"

                rotation="0 180 0"

                scale="0.8 0.8 0.8"

                animation-mixer="
                    clip: idle;
                    timeScale: 1;
                    crossFadeDuration: 0.3;
                "
            >
            </a-gltf-model>

        </a-entity>


        <!-- =========================
             TARGET 2
             خريطة مادبا
        ========================== -->

        <a-entity
            id="target2"
            mindar-image-target="targetIndex: 2">

            <a-gltf-model

                id="character2"

                src="#characterModel"

                position="0 0 0"

                rotation="0 180 0"

                scale="0.8 0.8 0.8"

                animation-mixer="
                    clip: idle;
                    timeScale: 1;
                    crossFadeDuration: 0.3;
                "
            >
            </a-gltf-model>

        </a-entity>

    </a-scene>


    <!-- =========================
         LANGUAGE
    ========================== -->

    <button id="languageButton">
        🌐 English
    </button>


    <div id="languageMenu">

        <button
            class="languageOption"
            data-language="en">
            🇬🇧 English
        </button>

        <button
            class="languageOption"
            data-language="ar">
            🇯🇴 العربية
        </button>

        <button
            class="languageOption"
            data-language="es">
            🇪🇸 Español
        </button>

        <button
            class="languageOption"
            data-language="fr">
            🇫🇷 Français
        </button>

        <button
            class="languageOption"
            data-language="de">
            🇩🇪 Deutsch
        </button>

        <button
            class="languageOption"
            data-language="it">
            🇮🇹 Italiano
        </button>

        <button
            class="languageOption"
            data-language="ru">
            🇷🇺 Русский
        </button>

    </div>


    <!-- =========================
         WELCOME SCREEN
    ========================== -->

    <section id="welcome">

        <div id="content">

            <h1 id="title">
                The Stone Speaks: A Story of the Land of Jordan
            </h1>

            <p id="description">
                Explore the history of Madaba through your phone camera.
            </p>

            <button id="startButton">
                Start Experience
            </button>

        </div>

    </section>

    <!-- CAMERA PERMISSION CONFIRMATION -->
    <div id="cameraPermissionModal" role="dialog" aria-modal="true" aria-labelledby="cameraPermissionTitle">
        <div id="cameraPermissionCard">
            <h2 id="cameraPermissionTitle">Allow camera access?</h2>
            <p id="cameraPermissionText">Living Madaba needs access to your camera to show the augmented-reality experience.</p>
            <div class="cameraPermissionActions">
                <button id="cameraPermissionNo" type="button">Not now</button>
                <button id="cameraPermissionYes" type="button">Yes, continue</button>
            </div>
        </div>
    </div>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- BACK -->

    <button id="backButton">
        ← Back
    </button>

        function startEnvironmentSounds() {
            bells.currentTime = 0;
            wind.currentTime = 0;
            
            // تشغيل الصوتيين بالتزامن
            Promise.all([
                bells.play(),
                wind.play()
            ]).catch(error => {
                console.log("تم حظر التشغيل التلقائي أو حدث خطأ:", error);
            });
        }

        // 2. إيقاف الأصوات فوراً (استدعِ هذه الدالة عندما تتوقف الحركة وتبدأ شخصية الحكي)
        function stopEnvironmentSounds() {
            // إيقاف وتصفير صوت الأجراس
            bells.pause();
            bells.currentTime = 0;
            
            // إيقاف وتصفير صوت الرياح
            wind.pause();
            wind.currentTime = 0;
        }
        /* =====================================================
           CHARACTER SETTINGS
        ===================================================== */

        const WALK_TIME = 3000;

        const SOUND_DELAY = 4500;


        const characterSettings = {

            0: {
                start: "0 0 0",
                end: "0 0 -0.8"
            },

            1: {
                start: "0 0 0",
                end: "0 0 -0.8"
            },

            2: {
                start: "0 0 0",
                end: "0 0 -0.8"
            }

        };


        /* =====================================================
           SCENE LOADED
        ===================================================== */

        arScene.addEventListener(
            "loaded",
            function () {

                mindarSystem =
                    arScene.systems[
                        "mindar-image-system"
                    ];

            }
        );


        /* =====================================================
           LANGUAGE
        ===================================================== */

        function changeLanguage(language) {

            currentLanguage = language;

            const text =
                translations[language];

            document.documentElement.lang =
                language;

            document.documentElement.dir =
                language === "ar"
                    ? "rtl"
                    : "ltr";


            title.innerText =
                text.title;

            description.innerText =
                text.description;

            startButton.innerText =
                text.start;

            cameraPermissionTitle.innerText = text.permissionTitle;
            cameraPermissionText.innerText = text.permissionText;
            cameraPermissionYes.innerText = text.permissionYes;
            cameraPermissionNo.innerText = text.permissionNo;

            languageButton.innerText =
                text.language;

            backButton.innerText =
                text.back;

            if (uiTitle && text.uiTitle) uiTitle.innerText = text.uiTitle;
            if (uiDesc && text.uiDesc) uiDesc.innerText = text.uiDesc;


            languageMenu.style.display =
                "none";

        }


        languageButton.addEventListener(
            "click",
            function () {

                languageMenu.style.display =
                    languageMenu.style.display === "block"
                        ? "none"
                        : "block";

            }
        );


        document
            .querySelectorAll(".languageOption")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        changeLanguage(
                            this.dataset.language
                        );

                    }
                );

            });


        /* =====================================================
           PLAY CHARACTER ANIMATION
        ===================================================== */

        function playAnimation(
            character,
            animationName
        ) {

            if (!character) return;


            character.setAttribute(
                "animation-mixer",
                `
                clip: ${animationName};
                timeScale: 1;
                crossFadeDuration: 0.3;
                `
            );

        }


        /* =====================================================
           MOVE CHARACTER
        ===================================================== */

        function moveCharacter(
            character,
            targetPosition
        ) {

            if (!character) return;


            character.setAttribute(
                "animation",
                {
                    property: "position",

                    to: targetPosition,

                    dur: WALK_TIME,

                    easing: "easeInOutQuad"
                }
            );

        }


        /* =====================================================
           STOP ALL JOURNEYS
        ===================================================== */

        function clearJourneyTimers() {

            journeyTimers.forEach(
                function (timer) {

                    clearTimeout(timer);

                }
            );

            journeyTimers = [];

        }


        /* =====================================================
           MERGED CHARACTER SEQUENCE
           WALK -> STAND/IDLE -> TALK -> IDLE
        ===================================================== */

        /* =====================================================
           START CHARACTER JOURNEY
        ===================================================== */

        function startCharacterJourney(index) {

            const character =
                document.getElementById(
                    "character" + index
                );

            if (!character) return;

            const target =
                document.getElementById(
                    "target" + index
                );

            const settings =
                characterSettings[index];


            /* إعادة الشخصية إلى نقطة البداية */

            character.setAttribute(
                "position",
                settings.start
            );

            character.removeAttribute(
                "animation"
            );


            /* =========================
               تشغيل الأصوات مع بداية التجربة
            ========================== */

            try {

                bellsSound.currentTime = 0;
                windSound.currentTime = 0;

                const bellPromise =
                    bellsSound.play();

                const windPromise =
                    windSound.play();

                if (bellPromise) {
                    bellPromise.catch(
                        function (error) {
                            console.log(
                                "Bell audio blocked:",
                                error
                            );
                        }
                    );
                }

                if (windPromise) {
                    windPromise.catch(
                        function (error) {
                            console.log(
                                "Wind audio blocked:",
                                error
                            );
                        }
                    );
                }

            } catch (error) {
                console.log(
                    "Audio play error:",
                    error
                );
            }


            /* =========================
               بعد 4.5 ثواني تبدأ الشخصية بالمشي
            ========================== */

            const soundTimer =
                setTimeout(
                    function () {

                        if (
                            target &&
                            !target.object3D.visible
                        ) {
                            return;
                        }


                        /* إعادة الشخصية قبل المشي */

                        character.setAttribute(
                            "position",
                            settings.start
                        );

                        character.removeAttribute(
                            "animation"
                        );


                        /* =========================
                           1. WALK
                        ========================== */

                        playAnimation(
                            character,
                            "walk"
                        );

                        moveCharacter(
                            character,
                            settings.end
                        );


                        /* =========================
                           بعد انتهاء المشي
                           2. STAND / IDLE
                        ========================== */

                        const standTimer =
                            setTimeout(
                                function () {

                                    if (
                                        target &&
                                        !target.object3D.visible
                                    ) {
                                        return;
                                    }


                                    character.removeAttribute(
                                        "animation"
                                    );


                                    /* تثبيت الشخصية في مكان النهاية */

                                    character.setAttribute(
                                        "position",
                                        settings.end
                                    );


                                    /* الوقوف بعد المشي */

                                    playAnimation(
                                        character,
                                        "idle"
                                    );


                                    /* =========================
                                       3. TALK
                                       يبدأ بعد الوقوف مباشرة
                                    ========================== */

                                    const talkStartTimer =
                                        setTimeout(
                                            function () {

                                                if (
                                                    target &&
                                                    !target.object3D.visible
                                                ) {
                                                    return;
                                                }


                                                character.removeAttribute(
                                                    "animation"
                                                );


                                                playAnimation(
                                                    character,
                                                    "talk"
                                                );


                                                showCharacterMessage(
                                                    index
                                                );


                                                const duration =
                                                    translations[
                                                        currentLanguage
                                                    ].talkDuration ||
                                                    6000;


                                                /* =========================
                                                   4. IDLE
                                                   بعد انتهاء الكلام
                                                ========================== */

                                                const idleTimer =
                                                    setTimeout(
                                                        function () {

                                                            if (
                                                                target &&
                                                                !target.object3D.visible
                                                            ) {
                                                                return;
                                                            }


                                                            character.removeAttribute(
                                                                "animation"
                                                            );


                                                            playAnimation(
                                                                character,
                                                                "idle"
                                                            );


                                                            message.style.display =
                                                                "none";

                                                        },
                                                        duration
                                                    );


                                                journeyTimers.push(
                                                    idleTimer
                                                );

                                            },
                                            500
                                        );


                                    journeyTimers.push(
                                        talkStartTimer
                                    );

                                },
                                WALK_TIME
                            );


                        journeyTimers.push(
                            standTimer
                        );


                    },
                    SOUND_DELAY
                );


            journeyTimers.push(
                soundTimer
            );
        }

        /* =====================================================
           CHARACTER MESSAGE
        ===================================================== */

        function showCharacterMessage(index) {

            const langData =
                translations[
                    currentLanguage
                ];


            if (
                !langData ||
                !langData.messages
            ) {
                return;
            }


            message.innerHTML =
                langData.messages[index];


            message.style.display =
                "block";

        }


        /* =====================================================
           START AR
        ===================================================== */

        async function startAR() {

            const text =
                translations[
                    currentLanguage
                ];


            message.innerText =
                text.cameraLoading;


            message.style.display =
                "block";


            try {

                if (!mindarSystem) {

                    mindarSystem =
                        arScene.systems[
                            "mindar-image-system"
                        ];

                }


                if (!mindarSystem) {

                    throw new Error(
                        "MindAR system not found"
                    );

                }


                arScene.style.visibility =
                    "visible";


                await mindarSystem.start();


                arStarted = true;


                welcome.style.display =
                    "none";


                uiContainer.style.display =
                    "block";


                backButton.style.display =
                    "block";


                message.style.display =
                    "none";

            }

            catch (error) {

                console.error(
                    "MindAR Error:",
                    error
                );


                message.innerText =
                    text.cameraDenied;


                message.style.display =
                    "block";

            }

        }


        startButton.addEventListener("click", function () {
            // Show the site's explanation first; the browser's own permission
            // prompt will still appear after the visitor chooses to continue.
            cameraPermissionModal.style.display = "flex";
        });

        cameraPermissionYes.addEventListener("click", function () {
            cameraPermissionModal.style.display = "none";
            // Calling startAR directly from this tap lets the browser permission
            // request occur as part of the user's interaction.
            startAR();
        });

        cameraPermissionNo.addEventListener("click", function () {
            cameraPermissionModal.style.display = "none";
        });


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        backButton.addEventListener(
            "click",
            async function () {

                clearJourneyTimers();


                /* إيقاف MindAR */

                try {

                    if (
                        mindarSystem &&
                        arStarted
                    ) {

                        await mindarSystem.stop();

                    }

                }

                catch (error) {

                    console.error(
                        "MindAR stop error:",
                        error
                    );

                }


                arStarted = false;


                /* إيقاف الأصوات */

                try {

                    bellsSound.pause();

                    windSound.pause();

                    bellsSound.currentTime = 0;

                    windSound.currentTime = 0;

                }

                catch (error) {

                    console.log(
                        "Audio stop error:",
                        error
                    );

                }


                /* إخفاء AR */

                arScene.style.visibility =
                    "hidden";


                uiContainer.style.display =
                    "none";


                backButton.style.display =
                    "none";


                message.style.display =
                    "none";


                welcome.style.display =
                    "flex";


                /* إعادة الشخصيات */

                for (
                    let i = 0;
                    i < 3;
                    i++
                ) {

                    const character =
                        document.getElementById(
                            "character" + i
                        );


                    if (character) {

                        character.removeAttribute(
                            "animation"
                        );


                        character.setAttribute(
                            "position",
                            characterSettings[i].start
                        );


                        playAnimation(
                            character,
                            "idle"
                        );

                    }

                }

            }
        );


        /* =====================================================
           TARGET EVENTS
        ===================================================== */

        document
            .querySelectorAll(
                "[mindar-image-target]"
            )
            .forEach(
                function (
                    targetEntity,
                    index
                ) {


                    /* =========================
                       TARGET FOUND
                    ========================== */

                    targetEntity.addEventListener(
                        "targetFound",
                        function () {

                            console.log(
                                "Target Found:",
                                index
                            );


                            clearJourneyTimers();


                            startCharacterJourney(
                                index
                            );

                        }
                    );


                    /* =========================
                       TARGET LOST
                    ========================== */

                    targetEntity.addEventListener(
                        "targetLost",
                        function () {

                            console.log(
                                "Target Lost:",
                                index
                            );


                            const character =
                                document.getElementById(
                                    "character" + index
                                );


                            if (character) {

                                character.removeAttribute(
                                    "animation"
                                );

                                character.setAttribute(
                                    "position",
                                    characterSettings[index].start
                                );

                            }


                            const anyTargetVisible =
                                Array
                                    .from(
                                        document.querySelectorAll(
                                            "[mindar-image-target]"
                                        )
                                    )
                                    .some(
                                        function (
                                            target
                                        ) {

                                            return (
                                                target !== targetEntity &&
                                                target.object3D.visible
                                            );

                                        }
                                    );


                            if (
                                !anyTargetVisible
                            ) {

                                message.style.display =
                                    "none";

                            }

                        }
                    );

                }
            );


        /* =====================================================
           INITIAL LANGUAGE
        ===================================================== */

        changeLanguage("en");

    </script>

</body>
